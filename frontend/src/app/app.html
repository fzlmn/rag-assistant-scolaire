<!-- frontend/src/app/app.html — barre du haut, menu latéral et écran courant -->
<header class="haut">
  <button class="burger" type="button" [class.ouvert]="menu()" [attr.aria-expanded]="menu()" aria-controls="menu" aria-label="Ouvrir ou fermer le menu" (click)="basculer()">
    <span></span><span></span><span></span>
  </button>
  <a class="marque" routerLink="/" (click)="fermer()">
    <app-logo [taille]="34" />
    <span class="nom"><strong>EIH</strong><small>École d'Ingénieurs Hélianthe</small></span>
  </a>
  <!-- → barre de navigation sur grand écran ; en dessous de 820 px, elle est remplacée par le hamburger (app.css) -->
  <nav class="raccourcis" aria-label="Accès rapide">
    <a routerLink="/conversation" routerLinkActive="actif" title="Poser une question à l'assistant">
      <app-icone nom="conversation" /><span>Conversation</span></a>
    <a routerLink="/documents" routerLinkActive="actif" title="Documents indexés">
      <app-icone nom="documents" /><span>Documents</span></a>
    <a routerLink="/recherche" routerLinkActive="actif" title="Recherche documentaire">
      <app-icone nom="recherche" /><span>Recherche</span></a>
  </nav>
</header>

<div class="voile" [class.ouvert]="menu()" (click)="fermer()"></div>
<aside id="menu" class="lateral" [class.ouvert]="menu()" [attr.aria-hidden]="!menu()">
  <div class="lateral-tete">
    <app-logo [taille]="44" />
    <div><strong>EIH</strong><small>Campus numérique</small></div>
  </div>
  <p class="etiquette">Navigation</p>
  <nav>
    <!-- → routerLinkActive ajoute la classe « actif » au lien de l'écran affiché -->
    <a routerLink="/" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }" (click)="fermer()">
      <app-icone nom="accueil" />Accueil</a>
    <a routerLink="/conversation" routerLinkActive="actif" (click)="fermer()">
      <app-icone nom="conversation" />Conversation</a>
    <a routerLink="/documents" routerLinkActive="actif" (click)="fermer()">
      <app-icone nom="documents" />Documents</a>
    <a routerLink="/recherche" routerLinkActive="actif" (click)="fermer()">
      <app-icone nom="recherche" />Recherche</a>
  </nav>
  <p class="lateral-pied">© 2026 EIH · établissement fictif</p>
</aside>

<main [class.large]="pleineLargeur()">                         <!-- → « large » : l'écran Conversation occupe toute la largeur -->
  <router-outlet />  <!-- → l'écran choisi s'affiche ici -->
</main>
